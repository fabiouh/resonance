name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Check versions
        run: node scripts/versions.mjs
      - name: Validate frontend and Rust
        run: pnpm validate
      - name: Build desktop test executable
        run: pnpm tauri build --debug --no-bundle
      - name: Test desktop persistence
        run: pnpm test:desktop
      - name: Build Windows installer
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
      - name: Test release startup
        if: github.event_name == 'push'
        run: pnpm test:desktop:release
      - name: Test installation and uninstallation
        if: github.event_name == 'push'
        run: ./scripts/test-installer.ps1 -Installer (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
      - name: Upload Windows installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: resonance-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
