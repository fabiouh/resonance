name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check versions
        run: node scripts/versions.mjs
      - name: Validate frontend and Rust
        run: pnpm validate
      - name: Build desktop test executable
        run: pnpm tauri build --debug --no-bundle
      - name: Test desktop persistence
        run: pnpm test:desktop
      - name: Build Windows installer
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
      - name: Test release startup
        if: github.event_name == 'push'
        run: pnpm test:desktop:release
      - name: Test installation and uninstallation
        if: github.event_name == 'push'
        run: ./scripts/test-installer.ps1 -Installer (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
      - name: Upload Windows installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resonance-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
